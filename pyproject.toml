[project]
name = "functiongemma-robot-action"
version = "0.1.0"
description = "A fine-tuned FunctionGemma 270M model that converts natural language commands into structured robot actions and avatar emotions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenMind", email = "hello@openmind.com" }
]
keywords = ["llm", "function-calling", "robotics", "gemma", "fastapi"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "accelerate>=1.1.0",
    "huggingface-hub>=0.26.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
training = [
    "peft>=0.13.0",
    "trl>=0.12.0",
    "datasets>=3.0.0",
]
benchmarks = [
    "requests>=2.32.0",
    "openai>=1.54.0",
]
dev = [
    "pytest>=8.3.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
all = [
    "functiongemma-robot-action[training,benchmarks,dev]",
]

[project.scripts]
train-g1 = "scripts.train_g1:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/functiongemma"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
]

[tool.uv.sources]
# Uncomment if you want to use local development versions
# functiongemma-robot-action = { path = ".", editable = true }

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["functiongemma"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Prevent pytest from loading ROS launch_testing plugins that conflict
norecursedirs = [".git", ".venv", "build", "dist", ".eggs"]
# Ignore certain entry points that cause conflicts
filterwarnings = ["ignore::DeprecationWarning"]
